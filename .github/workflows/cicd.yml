name: DFCS CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dfcs-cicd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read pinned tools
        id: pins
        run: |
          $manifest = Get-Content tools/tool-versions.cmake -Raw
          foreach ($name in @('CMAKE', 'NINJA', 'CI_PYTHON', 'WINLIBS_URL', 'WINLIBS_SHA256')) {
            $match = [regex]::Match($manifest, 'set\(DFCS_PIN_' + $name + ' "([^"]+)"\)')
            if (-not $match.Success) { throw "Missing tool pin: $name" }
            "$name=$($match.Groups[1].Value)" >> $env:GITHUB_OUTPUT
          }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ steps.pins.outputs.CI_PYTHON }}
      - name: Install pinned build tools
        env:
          CMAKE_VERSION: ${{ steps.pins.outputs.CMAKE }}
          NINJA_VERSION: ${{ steps.pins.outputs.NINJA }}
          WINLIBS_URL: ${{ steps.pins.outputs.WINLIBS_URL }}
          WINLIBS_SHA256: ${{ steps.pins.outputs.WINLIBS_SHA256 }}
        run: |
          python -m pip install --disable-pip-version-check "cmake==$env:CMAKE_VERSION" "ninja==$env:NINJA_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = Join-Path $env:RUNNER_TEMP 'winlibs.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'winlibs'
          Invoke-WebRequest -Uri $env:WINLIBS_URL -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:WINLIBS_SHA256) {
            throw 'WinLibs checksum mismatch'
          }
          Expand-Archive -Path $archive -DestinationPath $destination
          $compilerBin = Join-Path $destination 'mingw64/bin'
          $compilerBin >> $env:GITHUB_PATH
          "CC=$compilerBin/gcc.exe" >> $env:GITHUB_ENV
          "CXX=$compilerBin/g++.exe" >> $env:GITHUB_ENV
      - name: Configure strict host build
        run: cmake --preset host-strict
      - name: Build
        run: cmake --build --preset host-strict --parallel 2
      - name: Unit tests
        run: ctest --preset host-strict --output-junit test-results.xml
      - name: Record build provenance
        if: always()
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          New-Item -ItemType Directory -Force build/ci | Out-Null
          @{
            revision = $env:SOURCE_REVISION
            preset = 'host-strict'
            cmake = (cmake --version | Select-Object -First 1)
            ninja = (ninja --version)
            compiler = (g++ --version | Select-Object -First 1)
            firmware_hex = 'blocked: STM32 build target and Arm toolchain are not configured'
          } | ConvertTo-Json | Set-Content build/ci/provenance.json
      - name: Publish test reports and provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: host-reports-${{ github.sha }}
          path: |
            build/host-strict/test-results.xml
            build/host-strict/Testing/Temporary/LastTest.log
            build/ci/provenance.json
            tools/tool-versions.cmake
          if-no-files-found: error
          retention-days: 14

  package-hex:
    name: HEX packaging (blocked)
    needs: build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report missing firmware prerequisite
        run: |
          echo '::warning::HEX packaging is blocked: no STM32 ELF target or pinned Arm toolchain exists (ST-073).'
          echo '### HEX packaging: BLOCKED' >> "$GITHUB_STEP_SUMMARY"
          echo 'No firmware HEX artifact was generated. Host executables are not flashable STM32 firmware.' >> "$GITHUB_STEP_SUMMARY"

  security-scans:
    name: Security scans
    needs: package-hex
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned security scanners
        id: security-tools
        run: |
          set -euo pipefail
          version=$(sed -n 's/^set(DFCS_PIN_GITLEAKS "\([^"]*\)")$/\1/p' tools/tool-versions.cmake)
          checksum=$(sed -n 's/^set(DFCS_PIN_GITLEAKS_SHA256 "\([^"]*\)")$/\1/p' tools/tool-versions.cmake)
          test -n "$version" && test -n "$checksum"
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --retry 3 "https://github.com/gitleaks/gitleaks/releases/download/v$version/gitleaks_${version}_linux_x64.tar.gz" --output "$archive"
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
            codeql_url=$(sed -n 's/^set(DFCS_PIN_CODEQL_URL "\([^"]*\)")$/\1/p' tools/tool-versions.cmake)
            codeql_checksum=$(sed -n 's/^set(DFCS_PIN_CODEQL_SHA256 "\([^"]*\)")$/\1/p' tools/tool-versions.cmake)
            test -n "$codeql_url" && test -n "$codeql_checksum"
            bundle="$RUNNER_TEMP/codeql-bundle.tar.gz"
            curl --fail --location --retry 3 "$codeql_url" --output "$bundle"
            printf '%s  %s\n' "$codeql_checksum" "$bundle" | sha256sum --check
            echo "CODEQL_BUNDLE=$bundle" >> "$GITHUB_OUTPUT"
      - name: Scan repository history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --report-format sarif --report-path "$RUNNER_TEMP/secrets.sarif"'
      - name: Initialize CodeQL
        if: ${{ !cancelled() }}
        uses: github/codeql-action/init@5c8ea125689a2c5ae2672d1d914ac4bcd95d1b4b
        with:
          tools: ${{ steps.security-tools.outputs.CODEQL_BUNDLE }}
          languages: c-cpp
          build-mode: none
          queries: security-extended
      - name: Analyze C++ security
        if: ${{ !cancelled() }}
        uses: github/codeql-action/analyze@5c8ea125689a2c5ae2672d1d914ac4bcd95d1b4b
        with:
          output: security-results
          upload: false
      - name: Block critical security findings
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          test -f security-results/cpp.sarif
          jq --exit-status '
            [.runs[] | .tool.driver.rules as $rules | .results[]? |
             $rules[.ruleIndex].properties["security-severity"] // "0" |
             tonumber | select(. >= 9.0)] | length == 0
          ' security-results/cpp.sarif
      - name: Publish security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-reports-${{ github.sha }}
          path: |
            security-results/*.sarif
            ${{ runner.temp }}/secrets.sarif
          if-no-files-found: error
          retention-days: 14

  deploy-aws:
    name: Deploy to AWS (disabled placeholder)
    needs: [package-hex, security-scans]
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Placeholder only
        run: echo 'AWS deployment is not implemented. No credentials, provisioning, uploads, or flashing.'